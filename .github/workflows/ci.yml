name: CI

on:
  push:
    branches:
      - dev
    paths-ignore:
      - '**.md'
      - 'assets/**'
  pull_request:
    branches:
      - dev
      - beta
      - main
    paths-ignore:
      - '**.md'
      - 'assets/**'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  ANDROID_PLATFORM: platforms;android-37.0
  ANDROID_BUILD_TOOLS: build-tools;36.0.0

jobs:
  verify:
    # Hosted runners: pull requests from forks run here, never on a machine of the project.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS" > /dev/null

      - name: Test, lint and build
        run: |
          ./gradlew --stacktrace \
            testDebugUnitTest \
            :app:compileDebugAndroidTestKotlin \
            lintDebug \
            :app:assembleRelease

      - name: Upload reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
